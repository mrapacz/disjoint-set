repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: trailing-whitespace
        - id: check-json
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.2
      hooks:
        - id: ruff
          args: [--fix]
          types_or: [python, pyi]
        - id: ruff
          args: ["check", "--select", "I", "--fix"]
        - id: ruff-format
          types_or: [python, pyi]
