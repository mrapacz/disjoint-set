version: 2.1

jobs:
  build:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: "Install uv"
          command: "curl -LsSf https://astral.sh/uv/install.sh | sh"
      - run:
          name: "Run tests"
          command: |
            source ~/.cargo/env
            make test

workflows:
  build:
    jobs:
      - build:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
